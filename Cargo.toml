[workspace]
members = [
    "indexer/crates/core",
    "indexer/crates/macros",
    "indexer/crates/proc-macros",
    "indexer/crates/test-utils",
    "indexer/metrics/*",
    "indexer/datasources/*",
    "indexer/decoders/*",
    "indexer",
    "grpc"
]
resolver = "2"

[workspace.package]
rust-version = "1.85.1"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/omnipair/omnipair-indexer"

[workspace.dependencies]

# carbon crates (local)
carbon-core = { path = "indexer/crates/core", version = "0.9.1" }
carbon-macros = { path = "indexer/crates/macros", version = "0.9.1" }
carbon-proc-macros = { path = "indexer/crates/proc-macros", version = "0.9.1" }
carbon-test-utils = { path = "indexer/crates/test-utils", version = "0.9.1" }
carbon-log-metrics = { path = "indexer/metrics/log-metrics", version = "0.9.1" }
carbon-prometheus-metrics = { path = "indexer/metrics/prometheus-metrics", version = "0.9.1" }
carbon-rpc-program-subscribe-datasource = { path = "indexer/datasources/rpc-program-subscribe-datasource", version = "0.9.1" }
carbon-rpc-transaction-crawler-datasource = { path = "indexer/datasources/rpc-transaction-crawler-datasource", version = "0.9.1" }
carbon-helius-atlas-ws-datasource = { path = "indexer/datasources/helius-atlas-ws-datasource", version = "0.9.1" }
carbon-omnipair-decoder = { path = "indexer/decoders/omnipair_decoder", version = "0.9.1" }

# misc
anyhow = "1.0.96"
async-stream = "0.3.6"
async-trait = { version = "0.1.86" }
base64 = "0.22.1"
bincode = "1.3"
borsh = { version = "0.10.4" }
borsh-derive-internal = "0.10.3"
bs58 = { version = "0.5.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.5"
futures = "0.3.30"
helius = "2.0"
hex = "0.4.3"
log = "0.4.25"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
proc-macro2 = "1"
quote = "1.0"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.138"
syn = { version = "1.0", features = ["full"] }
thiserror = { version = "2.0.12", default-features = false }
tokio = { version = "1.43.0", features = ["rt", "time", "signal", "macros"] }
tokio-util = "0.7.13"
uuid = { version = "1.6.1", features = ["serde", "v7"] }

# solana — Agave 4.2.1 stack (helius 2.0) + message/transaction 4.x for v1 decode
solana-account = "3.4"
solana-account-decoder = "=4.2.1"
solana-account-decoder-client-types = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-client = "=4.2.1"
solana-clock = "3.0"
solana-commitment-config = "3.1"
solana-hash = "4.5"
solana-instruction = { version = "=3.4.1", default-features = false }
solana-message = "4.4"
solana-program = "3.0"
solana-pubkey = { version = "4.2", features = ["serde", "borsh"] }
solana-sdk = "=4.0.1"
solana-signature = { version = "3.4", features = ["rand"] }
solana-system-interface = "2.0"
solana-transaction = "4.1"
solana-transaction-context = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-transaction-status = { version = "=4.2.1", features = ["agave-unstable-api"] }
